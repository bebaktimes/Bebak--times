<!doctype html>
<html lang="hi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>बेबाक टाइम्स</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .share-box {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .share-title {
      font-weight: 700;
      margin-bottom: 12px;
    }

    .share-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #fff;
      text-decoration: none;
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
    }

    .whatsapp {
      background: #25D366;
    }

    .facebook {
      background: #1877F2;
    }

    .twitter {
      background: #111;
    }

    .instagram {
      background: #C13584;
    }

    .copy {
      background: #555;
    }
  </style>

</head>

<body>

<header>

  <div class="top">
    भारत का डिजिटल हिंदी न्यूज पोर्टल
  </div>

  <div class="brand">
    <strong>बेबाक <span>टाइम्स</span></strong>
    <small>सच के साथ • बिना लाग-लपेट</small>
  </div>

  <nav>
    <a href="index.html">होम</a>
    <a href="index.html#national">राष्ट्रीय</a>
    <a href="index.html#maharashtra">महाराष्ट्र</a>
    <a href="index.html#politics">राजनीति</a>
    <a href="index.html#crime">क्राइम</a>
    <a href="index.html#business">बिजनेस</a>
    <a href="index.html#sports">खेल</a>
    <a href="index.html#entertainment">मनोरंजन</a>
  </nav>

</header>


<main>

  <article id="article" class="panel">

    <p>खबर लोड हो रही है...</p>

  </article>

</main>


<footer>
  © 2026 बेबाक टाइम्स — सर्वाधिकार सुरक्षित
</footer>


<script>

const SUPABASE_URL =
  "https://drhvsfuvifnhdtxsfyai.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2hW_8MXdWQI2ry0-mXgraQ_GQU_4xL7";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const esc = (s) =>
  String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[c]));


async function loadArticle() {

  const box =
    document.getElementById("article");

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  if (!id) {

    box.innerHTML =
      "<h2>खबर नहीं मिली</h2>";

    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("news")
      .select("*")
      .eq("id", id)
      .eq("published", true)
      .single();


  if (error || !data) {

    box.innerHTML =
      "<h2>यह खबर उपलब्ध नहीं है।</h2>";

    return;
  }


  document.title =
    data.title + " | बेबाक टाइम्स";


  box.innerHTML = `

    ${
      data.is_breaking
        ? `<span class="tag">BREAKING NEWS</span>`
        : ""
    }

    <small>
      ${esc(data.category)}
      •
      ${new Date(
        data.created_at
      ).toLocaleString("hi-IN")}
    </small>

    <h1>
      ${esc(data.title)}
    </h1>

    ${
      data.image_url
        ? `
          <img
            src="${esc(data.image_url)}"
            alt="${esc(data.title)}"
            style="
              width:100%;
              max-height:520px;
              object-fit:cover;
              border-radius:10px;
              margin:15px 0;
            "
          >
        `
        : ""
    }

    <div
      style="
        font-size:18px;
        line-height:1.8;
      "
    >
      ${esc(data.content)
        .replace(/\n/g, "<br>")}
    </div>


    <div class="share-box">

      <div class="share-title">
        📤 खबर शेयर करें
      </div>

      <div class="share-buttons">

        <a
          id="whatsappBtn"
          class="share-btn whatsapp"
          target="_blank"
          rel="noopener"
        >
          🟢 WhatsApp
        </a>

        <a
          id="facebookBtn"
          class="share-btn facebook"
          target="_blank"
          rel="noopener"
        >
          🔵 Facebook
        </a>

        <a
          id="twitterBtn"
          class="share-btn twitter"
          target="_blank"
          rel="noopener"
        >
          ⚫ X / Twitter
        </a>

        <button
          class="share-btn instagram"
          onclick="instagramShare()"
        >
          🟣 Instagram
        </button>

        <button
          class="share-btn copy"
          onclick="copyLink()"
        >
          🔗 लिंक कॉपी करें
        </button>

      </div>

      <p
        id="shareMsg"
        class="msg"
      ></p>

    </div>

  `;


  setupShareButtons(
    data.title
  );

}


function setupShareButtons(title) {

  const url =
    window.location.href;


  const text =
    title +
    "\n\nबेबाक टाइम्स पर पूरी खबर पढ़ें:";


  document.getElementById(
    "whatsappBtn"
  ).href =
    "https://wa.me/?text=" +
    encodeURIComponent(
      text + "\n" + url
    );


  document.getElementById(
    "facebookBtn"
  ).href =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(url);


  document.getElementById(
    "twitterBtn"
  ).href =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(text) +
    "&url=" +
    encodeURIComponent(url);

}


async function instagramShare() {

  const url =
    window.location.href;

  try {

    await navigator.clipboard.writeText(
      url
    );

    document.getElementById(
      "shareMsg"
    ).textContent =
      "✅ लिंक कॉपी हो गया। Instagram खोलकर इसे अपनी Story/Bio/पोस्ट में शेयर कर सकते हैं।";

  } catch (e) {

    prompt(
      "Instagram पर शेयर करने के लिए यह लिंक कॉपी करें:",
      url
    );

  }

}


async function copyLink() {

  const url =
    window.location.href;

  try {

    await navigator.clipboard.writeText(
      url
    );

    document.getElementById(
      "shareMsg"
    ).textContent =
      "✅ खबर का लिंक कॉपी हो गया।";

  } catch (e) {

    prompt(
      "यह लिंक कॉपी करें:",
      url
    );

  }

}


loadArticle();

</script>

</body>
</html>
